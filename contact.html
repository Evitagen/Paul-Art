<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Paul Bellingham</title>
<link rel="stylesheet" href="css/site.css">
  <script src="js/site.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-name" href="index.html">Paul Bellingham</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="bio.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div class="contact">
        <h1>Contact</h1>
        <p class="lead">Enquiries about the work, commissions, or print requests &mdash; send a message and I’ll reply as soon as I can.</p>
        <form id="contact-form" novalidate>
          <div class="field">
            <label for="cf-name">Name</label>
            <input id="cf-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="cf-email">Email</label>
            <input id="cf-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="cf-message">Message</label>
            <textarea id="cf-message" name="message" rows="5" required></textarea>
          </div>
          <button class="btn-dark" type="submit">Send message</button>
          <p class="form-note" id="form-note"></p>
        </form>
        <p class="direct">Prefer email? Paul Bellingham &mdash; <a href="mailto:your.email@example.com">your.email@example.com</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; 2026 Paul Bellingham</span>
      <span>8 paintings &middot; Generated 2026-10-29</span>
    </div>
  </footer>
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Painting viewer">
    <button class="lb-btn" id="lb-close" type="button" aria-label="Close viewer">&times;</button>
    <button class="lb-btn" id="lb-zoom" type="button" aria-label="Tour the painting in detail" title="Tour the painting in detail">&#10530;</button>
    <button class="lb-btn" id="lb-prev" type="button" aria-label="Previous painting">&#8249;</button>
    <img id="lb-img" alt="">
    <button class="lb-btn" id="lb-next" type="button" aria-label="Next painting">&#8250;</button>
    <div class="lb-caption" id="lb-caption"></div>
  </div>
  <script>window.__CONTACT = {"email":"your.email@example.com","formUrl":""};</script>
</body>
</html>
